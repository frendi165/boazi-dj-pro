<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#25252f"><title>BOAZI DJ PRO</title>
<style>
:root{--bg:#282832;--panel:#30303b;--line:#4a4a56;--text:#f4f4f8;--muted:#a9a9b6;--purple:#6d3bd1;--teal:#36c5aa;--purple2:#9b72ff}
*{box-sizing:border-box}body{margin:0;background:#1c1c24;color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit;touch-action:manipulation}.app{width:100%;max-width:1600px;margin:auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}.top{height:38px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:3px 10px;border-bottom:1px solid #16161d;background:#292932;gap:8px}.tracktop{font-size:10px;color:#f1f1f4;display:flex;align-items:center;gap:5px;min-width:0}.tracktop.right{justify-content:flex-end}.covermini{width:27px;height:27px;border:1px solid #60606b;border-radius:2px;background:linear-gradient(135deg,#4c2c8b,#14141d 50%,#36c5aa);flex-shrink:0}.tracktext{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.wave{height:8px;width:70px;background:repeating-linear-gradient(90deg,#7d4bdf 0 2px,transparent 2px 4px);margin-top:3px;border-radius:2px}.recordbox{display:flex;align-items:center;flex-direction:column;gap:0;font-size:9px;font-weight:bold}.record{border:0;border-radius:50%;width:27px;height:27px;background:#050508;font-size:14px}.recDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c91829;margin-right:3px}.toolbar{height:34px;display:flex;align-items:center;justify-content:center;gap:7px;background:#2d2d37;border-bottom:1px solid #181820}.round{width:25px;height:25px;border:1px solid #696975;border-radius:50%;background:#292932;font-size:13px;display:grid;place-items:center}.toolbar .round{font-size:12px}.main{display:grid;grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr);gap:4px;padding:4px;flex:1;min-height:270px}.deck{min-width:0;display:flex;flex-direction:column;gap:4px}.deckhead{display:flex;justify-content:space-between;align-items:center;height:20px;font-size:9px;color:var(--muted)}.deckbody{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px;align-items:center;flex:1;min-height:0}.deck.right .deckbody{grid-template-columns:minmax(0,1fr) 24px}.tempo{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:8px;color:#bcbcc7}.tempo input{height:clamp(100px,27vh,280px);width:18px;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;accent-color:#ddd}.pct{font-size:8px;border:1px solid #686873;border-radius:3px;padding:2px 1px;white-space:nowrap}.platter{width:100%;aspect-ratio:1;border-radius:50%;background:#111119;border:1px solid #09090d;box-shadow:0 0 0 2px #44444d;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:none;user-select:none;max-height:44vh}.recordart{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at center,#25252d 0 2px,#17171f 3px 4px);border:8px solid #111116}.recordart.loaded{background:repeating-radial-gradient(circle at center,#24242d 0 2px,#15151d 3px 4px),linear-gradient(130deg,#50338b,#171720 45%,#2b9f8d)}.recordart:after{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid #565662;box-shadow:0 0 0 2px #111}.recordart.spinning{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.labeldisc{z-index:2;width:31%;aspect-ratio:1;border-radius:50%;background:#25252e;border:1px solid #555562;display:grid;place-items:center;text-align:center;font-size:7px;font-weight:bold;color:#d4d4dd;line-height:1.2}.left .labeldisc{border-color:#8c65ed}.right .labeldisc{border-color:#51d4bd}.platter .needle{position:absolute;z-index:3;left:50%;top:0;width:1px;height:100%;background:#ffffff20;transform:rotate(18deg)}.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.btn{background:linear-gradient(#4a4a56,#3b3b46);border:1px solid #24242d;border-radius:4px;box-shadow:0 1px 0 #111;min-height:28px;font-size:10px;font-weight:bold;color:#eee}.btn.active{background:#7550c8;border-color:#9e84ec}.right .btn.active{background:#37bda4;border-color:#85edda;color:#10201d}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.center .fader{height:clamp(100px,28vh,280px);width:16px;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;accent-color:#e7e7ed}.gridbtn{margin-top:4px}.bottom{border-top:1px solid #16161d;background:#292932;padding:5px;display:flex;flex-direction:column;gap:5px}.panel{display:none;min-height:96px}.panel.active{display:block}.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;height:100px}.pad{border:0;border-radius:3px;background:var(--purple);font-size:10px;font-weight:bold}.pads.teal .pad{background:var(--teal);color:#16312d}.eq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:center;padding:4px}.eqitem{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9px;color:var(--muted)}.eqitem input{height:70px;width:17px;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;accent-color:#d6d6df}.settings{display:grid;grid-template-columns:1fr 1fr;gap:5px}.settings button{background:#3c3c47;border:1px solid #555561;border-radius:4px;padding:8px;font-size:10px;text-align:left}.crossarea{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:7px;padding:3px 4px 6px}.crossarea button{border:0;background:#454550;border-radius:4px;padding:7px 3px;font-size:9px;font-weight:bold}.crosswrap{display:flex;flex-direction:column;gap:3px}.crossline{height:6px;border-radius:5px;background:linear-gradient(90deg,#6e3dd2 0 50%,#36c5aa 50%)}#cross{width:100%;height:13px;accent-color:#eee}.fileline{display:flex;gap:4px;align-items:center;padding:0 5px 6px;font-size:9px;color:var(--muted)}.fileline input{min-width:0;width:100%;font-size:9px}.status{font-size:10px;text-align:center;color:#c5c5d0;padding:2px 5px;min-height:16px}
@media(min-width:850px){.app{min-height:100vh}.top{height:48px}.toolbar{height:40px}.main{padding:8px 14px;gap:10px}.deckbody{grid-template-columns:36px minmax(0,1fr);gap:10px}.deck.right .deckbody{grid-template-columns:minmax(0,1fr) 36px}.round{width:32px;height:32px}.btn{min-height:42px;font-size:14px}.deckhead{font-size:12px}.platter{max-width:460px;margin:auto}.bottom{padding:10px}.panel{min-height:150px}.pads{height:150px}.pad{font-size:14px}.eqitem input{height:110px}.center .fader{height:36vh;width:22px}.crossarea button{font-size:12px;padding:10px}.status{font-size:12px}}
</style></head>
<body><div class="app">
<header class="top">
<div class="tracktop"><div class="covermini"></div><div class="tracktext"><div id="titleA">Load a song</div><div class="wave" id="waveformA"></div></div></div>
<div class="recordbox"><button class="record" id="rec">Ⅱ</button><div><span class="recDot"></span>REC</div></div>
<div class="tracktop right"><div class="tracktext" style="text-align:right"><div id="titleB">Load a song</div><div class="wave" id="waveformB" style="margin-left:auto"></div></div><div class="covermini"></div></div>
</header>
<div class="toolbar"><button class="round" id="showDeck" title="Decks">◉</button><button class="round" id="showEQ" title="EQ">☷</button><button class="round" id="showPads" title="Sampler">▦</button><button class="round" id="showSettings" title="Settings">⚙</button><button class="round" id="fx" title="Effects">FX</button></div>
<main class="main" id="decksView">
<section class="deck left"><div class="deckhead"><span>DECK A</span><span id="timeA">00:00</span></div><div class="deckbody"><div class="tempo">TEMPO<input id="tempoA" type="range" min="-20" max="20" value="0"><div class="pct" id="pctA">0.0%</div></div><div class="platter" id="platterA"><div class="recordart" id="artA"></div><div class="needle"></div><div class="labeldisc">BOAZI<br>DJ PRO</div></div></div><div class="buttons"><button class="btn" id="cueA">CUE</button><button class="btn" id="playA">▶</button><button class="btn" id="syncA">SYNC</button></div></section>
<div class="center"><button class="round" id="reset">↻</button><button class="round" id="mixerBtn">☷</button><input class="fader" id="master" type="range" min="0" max="100" value="80" title="Master volume"><div class="pct">MASTER</div><button class="round gridbtn" id="grid">▦</button></div>
<section class="deck right"><div class="deckhead"><span id="timeB">00:00</span><span>DECK B</span></div><div class="deckbody"><div class="platter" id="platterB"><div class="recordart" id="artB"></div><div class="needle"></div><div class="labeldisc">BOAZI<br>DJ PRO</div></div><div class="tempo">TEMPO<input id="tempoB" type="range" min="-20" max="20" value="0"><div class="pct" id="pctB">0.0%</div></div></div><div class="buttons"><button class="btn" id="syncB">SYNC</button><button class="btn" id="cueB">CUE</button><button class="btn" id="playB">▶</button></div></section>
</main>
<section class="bottom">
<div class="panel" id="padsPanel"><div style="font-size:10px;color:#aaa;padding:0 0 5px">SAMPLER PADS</div><div class="pads" id="padsA"><button class="pad">1</button><button class="pad">2</button><button class="pad">3</button><button class="pad">4</button><button class="pad">5</button><button class="pad">6</button></div></div>
<div class="panel" id="eqPanel"><div class="eq"><div class="eqitem">LEFT LOW<input type="range" min="0" max="100" value="50" id="lowA"></div><div class="eqitem">LEFT MID<input type="range" min="0" max="100" value="50" id="midA"></div><div class="eqitem">LEFT HIGH<input type="range" min="0" max="100" value="50" id="highA"></div><div class="eqitem">LEFT FILTER<input type="range" min="0" max="100" value="50" id="filterA"></div><div class="eqitem">RIGHT LOW<input type="range" min="0" max="100" value="50" id="lowB"></div><div class="eqitem">RIGHT MID<input type="range" min="0" max="100" value="50" id="midB"></div><div class="eqitem">RIGHT HIGH<input type="range" min="0" max="100" value="50" id="highB"></div><div class="eqitem">RIGHT FILTER<input type="range" min="0" max="100" value="50" id="filterB"></div></div></div>
<div class="panel" id="settingsPanel"><div class="settings"><button id="settingsInfo">⚙ Advanced settings</button><button id="keylock">♬ Keylock (preview)</button><button id="automix">▶ Automix (preview)</button><button id="quantize">◉ Quantize (preview)</button><button id="tutorial">? Tutorial</button><button id="recordInfo">● Recording</button></div></div>
<div class="fileline"><span>LOAD TRACKS</span><input type="file" id="fileA" accept="audio/*" aria-label="Load left deck audio"><input type="file" id="fileB" accept="audio/*" aria-label="Load right deck audio"></div>
<div class="crossarea"><button id="loadLeft" onclick="document.getElementById('fileA').click()">LOAD A</button><div class="crosswrap"><div class="crossline"></div><input id="cross" type="range" min="0" max="100" value="50" aria-label="Crossfader"></div><button id="loadRight" onclick="document.getElementById('fileB').click()">LOAD B</button></div>
<div class="status" id="status">Load audio files from your phone to start mixing.</div></section>
<audio id="audioA" preload="metadata"></audio><audio id="audioB" preload="metadata"></audio>
</div>
<script>
const $=id=>document.getElementById(id),D={A:{a:$('audioA'),f:$('fileA'),p:$('platterA'),art:$('artA'),play:$('playA'),cue:$('cueA'),tempo:$('tempoA'),pct:$('pctA'),title:$('titleA'),time:$('timeA'),cueTime:0,url:null},B:{a:$('audioB'),f:$('fileB'),p:$('platterB'),art:$('artB'),play:$('playB'),cue:$('cueB'),tempo:$('tempoB'),pct:$('pctB'),title:$('titleB'),time:$('timeB'),cueTime:0,url:null}};
function say(s){$('status').textContent=s}function format(n){if(!isFinite(n))return'00:00';return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')}
function update(k,on){let d=D[k];d.p.classList.toggle('spinning',on);d.art.classList.toggle('spinning',on);d.play.textContent=on?'Ⅱ':'▶';d.play.classList.toggle('active',on)}
function vol(){let x=+$('cross').value/100,m=+$('master').value/100;D.A.a.volume=m*Math.cos(x*Math.PI/2);D.B.a.volume=m*Math.sin(x*Math.PI/2)}
for(let k of ['A','B']){let d=D[k];d.f.onchange=()=>{let f=d.f.files[0];if(!f)return;if(d.url)URL.revokeObjectURL(d.url);d.url=URL.createObjectURL(f);d.a.src=d.url;d.a.load();d.title.textContent=f.name;d.art.classList.add('loaded');d.cueTime=0;update(k,false);say('Loaded '+f.name+' on deck '+k+'. Press play.')};d.play.onclick=async()=>{if(!d.a.src){say('Choose a music file for deck '+k+' first.');d.f.click();return}try{if(d.a.paused){await d.a.play();update(k,true);say('Playing deck '+k)}else{d.a.pause();update(k,false);say('Paused deck '+k)}}catch(e){say('This file could not play. Try an MP3 file.')}};d.a.onplay=()=>update(k,true);d.a.onpause=()=>update(k,false);d.a.onended=()=>update(k,false);d.a.ontimeupdate=()=>d.time.textContent=format(d.a.currentTime);d.tempo.oninput=()=>{let v=+d.tempo.value;d.pct.textContent=(v>0?'+':'')+(v/10).toFixed(1)+'%';d.a.playbackRate=1+v/100};d.cue.onclick=()=>{if(!d.a.src){say('Load a song first.');d.f.click();return}if(!d.a.paused){d.cueTime=d.a.currentTime;d.a.pause();d.a.currentTime=d.cueTime;say('Cue point saved on deck '+k)}else{d.a.currentTime=d.cueTime;d.a.play().catch(()=>{});say('Cue preview on deck '+k)}};
let last=null;d.p.onpointerdown=e=>{if(!d.a.src){say('Load a track to scratch or seek.');return}last=e.clientX;d.p.setPointerCapture(e.pointerId);d.art.style.animation='none'};d.p.onpointermove=e=>{if(last===null)return;d.a.currentTime=Math.max(0,Math.min(d.a.duration||1e9,d.a.currentTime+(e.clientX-last)*.03));last=e.clientX};function end(){last=null;d.art.style.animation=''}d.p.onpointerup=end;d.p.onpointercancel=end}
$('cross').oninput=vol;$('master').oninput=vol;$('reset').onclick=()=>{$('cross').value=50;$('master').value=80;vol();say('Mixer reset.')};$('syncA').onclick=()=>{D.A.tempo.value=D.B.tempo.value;D.A.tempo.dispatchEvent(new Event('input'));say('Deck A tempo matched to Deck B.')};$('syncB').onclick=()=>{D.B.tempo.value=D.A.tempo.value;D.B.tempo.dispatchEvent(new Event('input'));say('Deck B tempo matched to Deck A.')};
function panel(which){for(let id of ['padsPanel','eqPanel','settingsPanel'])$(id).classList.remove('active');if(which)$(which).classList.add('active')}
$('showDeck').onclick=()=>{panel(null);say('Two-deck view.')};$('showEQ').onclick=()=>{panel('eqPanel');say('EQ controls opened. These are interface controls; audio EQ processing is not yet connected.')};$('showPads').onclick=$('grid').onclick=()=>{panel('padsPanel');say('Sampler panel opened. Tap a pad to play a tone.')};$('showSettings').onclick=()=>panel('settingsPanel');$('mixerBtn').onclick=()=>say('Adjust master volume and crossfader to balance both decks.');$('fx').onclick=()=>say('FX panel selected. Real audio effects are a future upgrade.');$('rec').onclick=()=>say('Recording/export is not connected yet.');$('recordInfo').onclick=()=>say('Recording/export is not connected yet.');$('settingsInfo').onclick=()=>say('BOAZI DJ PRO settings: local music files stay on your device.');$('keylock').onclick=()=>say('Keylock is a preview button; pitch-preserving keylock is not implemented yet.');$('automix').onclick=()=>say('Automix is a preview button; automatic transitions are not implemented yet.');$('quantize').onclick=()=>say('Quantize is a preview button; beat-grid quantization is not implemented yet.');$('tutorial').onclick=()=>say('Tutorial: load two audio files, press play, adjust tempo, then move the crossfader.');$('rec').onclick=()=>say('REC UI ready; audio recording will be added in a later version.');
document.querySelectorAll('#padsA .pad').forEach((b,i)=>b.onclick=()=>{try{let C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=[440,523,587,659,784,880][i];g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.31);say('Sampler pad '+(i+1)+' played.')}catch(e){say('Sampler sound unavailable in this browser.')}});
vol();
</script></body></html>
